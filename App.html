const I = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',

/* ---------- Fechas ---------- */
const dos = n => String(n).padStart(2, '0');
const claveDia = d => d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate());
const hoyClave = () => claveDia(new Date());
const deClave = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const hora = iso => { const d = new Date(iso); return dos(d.getHours()) + ':' + dos(d.getMinutes()); };
const rango = r => r.todoElDia ? 'Todo el día' : hora(r.inicio) + ' – ' + hora(r.fin);
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const ddmm = k => k ? k.slice(8, 10) + '/' + k.slice(5, 7) : '';
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- Comunicación con el servidor ---------- */
function run(fn, ...args) {
  return new Promise((ok, ko) => {
    const r = google.script.run
      .withSuccessHandler(r => {
        let o;
        try { o = JSON.parse(r); } catch (e) { return ko(new Error('Respuesta inválida del servidor.')); }
        o.ok ? ok(o) : ko(Object.assign(new Error(o.error || 'Ocurrió un error.'), { expirada: !!o.expirada }));
      })
      .withFailureHandler(e => ko(new Error((e && e.message) || 'No se pudo conectar con el servidor.')));
    if (typeof r[fn] !== 'function') {
      console.error('Función del servidor no encontrada: ' + fn);
      return ko(new Error('El servidor no tiene la función «' + fn + '». Revisa que Código.gs esté actualizado y vuelve a implementar.'));
    }
    r[fn](...args);
  });
}

async function call(accion, datos) {
  try {
    const o = await run('api', S.token, accion, datos || {});
    return o.data;
  } catch (e) {
    if (e.expirada) { salir('Tu sesión expiró. Vuelve a ingresar.'); e.message = 'Sesión expirada.'; }
    throw e;
  }
}

const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- Sesión ---------- */
function marcaHTML() {
  const logo = CFG.logo
    ? `<img class="logo-img" src="${esc(CFG.logo)}" alt="Pisquera de Chile">`
    : `<div class="logo-txt"><b>PISQUERA</b><b>DE CHILE</b></div>`;
  return logo + `<div class="brand-sub">INTRANET</div>`;
}

function mostrarLogin(msg) {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  const m = $('#loginMsg');
  m.textContent = msg || '';
  m.classList.toggle('hidden', !msg);

  // Las cuentas @ccu.cl solo entran con la sesión de Google detectada por el servidor;
  // el campo de correo es exclusivo para las cuentas de prueba @demo.cl.
  const sso = !!CFG.ssoEmail;
  $('#ssoPrompt').classList.toggle('hidden', !sso);
  $('#ssoEmailLabel').textContent = CFG.ssoEmail || '';
  $('#ssoAusente').classList.toggle('hidden', sso || !!msg);
  $('#demoBox').classList.toggle('hidden', !CFG.demo);
  $('#registroForm').email.value = CFG.ssoEmail || '';

  mostrarTab('login');
}

function mostrarTab(cual) {
  const reg = cual === 'registro' && CFG.registro;
  $('#tabLogin').setAttribute('aria-selected', String(!reg));
  $('#tabRegistro').setAttribute('aria-selected', String(reg));
  $('#loginForm').classList.toggle('hidden', reg);
  $('#registroForm').classList.toggle('hidden', !reg);
  $('#loginErr').textContent = ''; $('#registroErr').textContent = '';
  const f = reg ? $('#registroForm') : $('#loginForm');
  setTimeout(() => { const i = [...f.querySelectorAll('input')].find(x => !x.value) || f.querySelector('input'); if (i) i.focus(); }, 50);
}

async function onRegistro(ev) {
  ev.preventDefault();
  const f = ev.target, btn = $('button[type=submit]', f), err = $('#registroErr');
  err.textContent = '';
  if (!f.nombre.value.trim()) { err.textContent = 'Completa tu nombre.'; return; }
  btn.disabled = true; btn.textContent = 'Registrando…';
  try {
    const o = await run('registrarse', { nombre: f.nombre.value, area: f.area.value });
    f.reset();
    entrar(o.token, o.usuario);
    toast('¡Cuenta registrada! Bienvenido a la intranet.');
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Registrar cuenta';
  }
}

function entrar(token, usuario) {
  S.token = token; S.user = usuario; S.cache = {};
  store.set('pq_t', token);
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#avatar').textContent = iniciales(usuario.nombre);
  $('#uNombre').textContent = usuario.nombre;
  $('#uRol').textContent = ROL_TXT[usuario.rol] + (usuario.area ? ' · ' + usuario.area : '');
  pintarNav();
  go('inicio');
  programarRecordatorios();
  clearInterval(S.recInt);
  S.recInt = setInterval(programarRecordatorios, 15 * 60000);
}

function salir(msg) {
  if (S.token) run('logout', S.token).catch(() => {});
  S.token = null; S.user = null; S.cache = {};
  clearInterval(S.recInt); (S.recTimers || []).forEach(clearTimeout); S.recTimers = [];
  S.cal = null; S.mesCache = {};
  store.set('pq_t', null);
  cerrarModal();
  mostrarLogin(msg);
}

async function onLogin(ev) {
  ev.preventDefault();
  const f = ev.target, btn = $('button[type=submit]', f), err = $('#loginErr');
  err.textContent = '';
  $('#loginMsg').classList.add('hidden');
  const email = f.email.value.trim().toLowerCase();
  if (!/@demo\.cl$/.test(email)) {
    err.textContent = 'Aquí solo ingresan las cuentas de prueba @demo.cl. Las cuentas @ccu.cl entran con su sesión de Google.';
    return;
  }
  btn.disabled = true; btn.textContent = 'Verificando cuenta…';
  try {
    const o = await run('login', email);
    f.reset();
    entrar(o.token, o.usuario);
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Ingresar con cuenta de prueba';
  }
}

async function onSsoDirecto() {
  if (!CFG.ssoEmail) return;
  const btn = $('#btnSsoDirecto'), err = $('#loginErr');
  err.textContent = '';
  btn.disabled = true;
  try {
    const o = await run('login');
    entrar(o.token, o.usuario);
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

/* ---------- Navegación ---------- */
const NAV = [
  { v: 'inicio', t: 'Inicio', i: 'home' },
  { v: 'maquinas', t: 'Máquinas', i: 'machine' },
  { v: 'guias', t: 'Guías de Funcionamiento', i: 'guide' },
  { v: 'documentos', t: 'Documentación', i: 'doc' },
  { v: 'reuniones', t: 'Reuniones', i: 'cal' },
  { v: 'tareas', t: 'Tareas', i: 'tasks' },
  { v: 'perfil', t: 'Mi Perfil', i: 'user' },
  { v: 'usuarios', t: 'Usuarios y accesos', i: 'users', rol: 'admin' }
];

function pintarNav() {
  $('#nav').innerHTML = NAV.filter(n => !n.rol || can(n.rol)).map(n =>
    (n.rol ? '<div class="nav-sep">ADMINISTRACIÓN</div>' : '') +
    `<a class="nav-i" data-go="${n.v}" data-nav="${n.v}" title="${esc(n.t)}">${ic(n.i)}<span>${esc(n.t)}</span></a>`
  ).join('');
}

function marcarNav(v) {
  const k = { maquina: 'maquinas', guia: 'guias', buscar: 'inicio' }[v] || v;
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === k));
}

const cerrarMenu = () => $('#app').classList.remove('menu-open');
const refrescar = () => go(S.view, S.params);

async function go(view, params = {}) {
  if (!S.user) return;
  if (!VIEWS[view] || (view === 'usuarios' && !can('admin'))) view = 'inicio';
  S.view = view; S.params = params;
  marcarNav(view); cerrarMenu();
  const id = ++S.rid, el = $('#view');
  el.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
  $('#main').scrollTop = 0;
  try {
    const r = await VIEWS[view](params);
    if (id !== S.rid) return;
    el.innerHTML = typeof r === 'string' ? r : r.html;
    if (r.after) r.after(el);
  } catch (e) {
    if (id !== S.rid || !S.user) return;
    el.innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
  }
}

/* ---------- Vista en tarjetas o listado ---------- */
const vistaDe = k => store.get('pq_v_' + k) === 'lista' ? 'lista' : 'tarjetas';
const selectorVista = k => `<div class="seg" role="group" aria-label="Tipo de vista" id="vSel">
  <button type="button" data-v="tarjetas" aria-pressed="${vistaDe(k) === 'tarjetas'}" title="Ver como tarjetas">${ic('grid', 18)}<span>Tarjetas</span></button>
  <button type="button" data-v="lista" aria-pressed="${vistaDe(k) === 'lista'}" title="Ver como listado">${ic('list', 18)}<span>Listado</span></button></div>`;
function enlazarVista(k, pintar) {
  $('#vSel').addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    store.set('pq_v_' + k, b.dataset.v);
    $('#vSel').querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));

  });

    <tbody>${lista.map(m => `<tr data-go="maquina" data-id="${esc(m.id)}" tabindex="0">
      <td><div class="celda-nom"><div class="tile-s t-blue">${ic('machine', 18)}</div><div><b>${esc(m.nombre)}</b><span class="code">${esc(m.id)}</span></div></div></td>

function tablaGuias(lista) {

    <tbody>${lista.map(g => `<tr data-go="guia" data-id="${esc(g.id)}" tabindex="0">
      <td><div class="celda-nom"><div class="tile-s t-green">${ic('guide', 18)}</div><div><b>${esc(g.titulo)}</b><span class="code">${esc(g.id)} · ${esc(g.maquinaNombre || g.maquinaId)}</span></div></div></td>

function linkDoc(d) {
  if (d.archivo) return `<button class="btn btn-sm" data-act="verDocumento" data-id="${esc(d.id)}">${ic('eye', 15)} Ver</button>`;
  return /^https:\/\//i.test(d.url)
    ? `<a class="btn btn-sm" href="${esc(d.url)}" target="_blank" rel="noopener">Abrir ${ic('ext', 15)}</a>`
    : '<span class="muted sm">Sin archivo</span>';
}

function tablaDocs(docs, conMaquina = true) {
  if (!docs.length) return vacio('No hay documentos para mostrar.');
  return `<div class="card table-wrap"><table class="tbl">
    <thead><tr><th>Código</th><th>Documento</th><th>Tipo</th>${conMaquina ? '<th>Máquina</th>' : ''}<th>Versión</th><th>Actualizado</th><th></th></tr></thead>
    <tbody>${docs.map(d => `<tr>
      <td class="code">${esc(d.id)}</td>
      <td><b>${esc(d.titulo)}</b></td>
      <td><span class="chip">${esc(d.tipo)}</span></td>
      ${conMaquina ? `<td><a class="lnk" data-go="maquina" data-id="${esc(d.maquinaId)}">${esc(d.maquinaId)}</a></td>` : ''}
      <td>${esc(d.version)}</td>
      <td class="muted">${esc(d.actualizado)}</td>
      <td class="row-acts">${linkDoc(d)}${can('editor') ? btnIcon('editarDocumento', d.id, 'edit', 'Editar') : ''}${can('admin') ? btnIcon('eliminarDocumento', d.id, 'trash', 'Eliminar') : ''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

// Formato simple para el contenido de las guías: "## Título", "- viñeta", **negrita**
function md(t) {
  let out = '', lista = false;
  esc(t).split('\n').forEach(l => {
    if (/^\s*- /.test(l)) {
      if (!lista) { out += '<ul>'; lista = true; }
      out += '<li>' + l.replace(/^\s*- /, '') + '</li>';
      return;
    }
    if (lista) { out += '</ul>'; lista = false; }
    if (l.startsWith('## ')) out += '<h3>' + l.slice(3) + '</h3>';
    else if (l.trim()) out += '<p>' + l + '</p>';
  });
  if (lista) out += '</ul>';
  return out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

/* ---------- Modales y formularios ---------- */
function abrirModal(html, clase = '') {
  const m = $('#modal');
  m.innerHTML = `<div class="m-box ${clase}" role="dialog" aria-modal="true">${html}</div>`;
  m.classList.remove('hidden');
  setTimeout(() => { const f = m.querySelector('input:not([readonly]),select,textarea'); if (f) f.focus(); }, 60);
}

function cerrarModal() {
  const m = $('#modal');
  m.classList.add('hidden');
  m.innerHTML = '';
  liberarArchivo();
}

function formModal({ titulo, sub = '', campos, valores = {}, boton = 'Guardar', cargando = 'Guardando…', onSubmit }) {
  const fields = campos.map(c => {
    const v = valores[c.k] ?? c.def ?? '';
    const req = c.req ? 'required' : '';
    let inp;
    if (c.type === 'select') {
      inp = `<select name="${c.k}" ${req}>${c.ph ? `<option value="">${esc(c.ph)}</option>` : ''}${c.opts.map(o => {
        const [val, lab] = Array.isArray(o) ? o : [o, o];
        return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`;
      }).join('')}</select>`;
    } else if (c.type === 'checkbox') {
      return `<label class="chk ${c.full ? 'fld full' : ''}" style="flex-direction:row"><input type="checkbox" name="${c.k}" ${v ? 'checked' : ''}> ${esc(c.label)}</label>`;
    } else if (c.type === 'file') {
      inp = `<input name="${c.k}" type="file" ${req} ${c.accept ? `accept="${esc(c.accept)}"` : ''}>`;
    } else if (c.type === 'textarea') {
      inp = `<textarea name="${c.k}" rows="${c.rows || 4}" ${req} ${c.max ? `maxlength="${c.max}"` : ''} ${c.ph ? `placeholder="${esc(c.ph)}"` : ''}>${esc(v)}</textarea>`;
    } else {
      inp = `<input name="${c.k}" type="${c.type || 'text'}" value="${esc(v)}" ${req} ${c.ro ? 'readonly' : ''} ${c.min ? `minlength="${c.min}"` : ''} ${c.ph ? `placeholder="${esc(c.ph)}"` : ''} ${c.type === 'password' ? 'autocomplete="new-password"' : ''}>`;
    }
    return `<label class="fld ${c.full ? 'full' : ''}"><span>${esc(c.label)}${c.req ? ' *' : ''}</span>${inp}${c.hint ? `<small>${esc(c.hint)}</small>` : ''}</label>`;
  }).join('');

  abrirModal(`<form class="form" id="mForm" novalidate>
    <div class="m-head"><div><h2>${esc(titulo)}</h2>${sub ? `<p class="muted">${esc(sub)}</p>` : ''}</div><button type="button" class="icon-btn" data-close title="Cerrar">${ic('x')}</button></div>
    <div class="form-grid">${fields}</div>
    <div class="form-err" id="mErr"></div>
    <div class="m-foot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn btn-primary" type="submit">${esc(boton)}</button></div>
  </form>`);

  $('#mForm').addEventListener('submit', async e => {

function leerArchivo(f) {
  const max = (CFG.maxArchivoMb || 10) * 1024 * 1024;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (CFG.extensiones && !CFG.extensiones.includes(ext)) return Promise.reject(new Error('Tipo de archivo no permitido (.' + ext + ').'));
  if (f.size > max) return Promise.reject(new Error(`El archivo pesa ${(f.size / 1048576).toFixed(1)} MB; el máximo es ${CFG.maxArchivoMb || 10} MB.`));
  return new Promise((ok, ko) => {
    const r = new FileReader();
    r.onload = () => ok({ nombre: f.name, mime: f.type, base64: String(r.result).split(',')[1] || '' });
    r.onerror = () => ko(new Error('No se pudo leer el archivo.'));
    r.readAsDataURL(f);
  });
}

function liberarArchivo() {
  if (!S.blobUrl) return;
  const u = S.blobUrl; S.blobUrl = null;
  setTimeout(() => URL.revokeObjectURL(u), 60000); // da tiempo a la pestaña nueva o la descarga
}

/* ---------- Reuniones ---------- */
function inicioGrilla(y, m) { const p = new Date(y, m, 1); return new Date(y, m, 1 - (p.getDay() + 6) % 7); }
const eventosMes = () => S.mesCache[S.cal.y + '-' + S.cal.m] || [];

async function cargarMes(forzar) {
  const { y, m } = S.cal, k = y + '-' + m;
  pintarCal();
  if (S.mesCache[k] && !forzar) return pintarDia();
  $('#calGrid').classList.add('cargando');
  $('#diaLista').innerHTML = '<div class="vacio-s">Cargando agenda…</div>';
  try {
    const desde = inicioGrilla(y, m), hasta = new Date(desde.getFullYear(), desde.getMonth(), desde.getDate() + 42);
    S.mesCache[k] = await call('reuniones', { desde: desde.toISOString(), hasta: hasta.toISOString() });
    if (S.view === 'reuniones' && S.cal.y === y && S.cal.m === m) { pintarCal(); pintarDia(); }
  } catch (e) {
    if ($('#diaLista')) $('#diaLista').innerHTML = `<div class="vacio-s">${esc(e.message)}</div>`;
  } finally {
    if ($('#calGrid')) $('#calGrid').classList.remove('cargando');
  }
}

function pintarCal() {
  if (!$('#calGrid')) return;
  const { y, m, sel } = S.cal;
  $('#mesLabel').textContent = cap(MESES[m]) + ' ' + y;
  const porDia = {};
  eventosMes().forEach(r => { const k = claveDia(new Date(r.inicio)); porDia[k] = (porDia[k] || 0) + 1; });
  const ini = inicioGrilla(y, m), hoy = hoyClave();
  let html = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i), k = claveDia(d), n = porDia[k] || 0;
    const txt = n ? plural(n, 'reunión', 'reuniones') : '';
    html += `<button type="button" class="cal-dia ${d.getMonth() !== m ? 'fuera' : ''} ${k === hoy ? 'hoy' : ''}" data-dia="${k}" aria-pressed="${k === sel}"
      aria-label="${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}${n ? ', ' + txt : ''}"><span class="num">${d.getDate()}</span>${n ? `<span class="cal-tag">${txt}</span>` : ''}</button>`;
  }
  $('#calGrid').innerHTML = html;
}

function pintarDia() {
  if (!$('#diaLista')) return;
  const d = deClave(S.cal.sel), ahora = new Date();
  $('#diaLabel').textContent = cap(DIAS[d.getDay()]) + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
  $('#btnReunionDia').dataset.id = S.cal.sel;
  const lista = eventosMes().filter(r => claveDia(new Date(r.inicio)) === S.cal.sel).sort((a, b) => new Date(a.inicio) - new Date(b.inicio));
  if (!lista.length) { $('#diaLista').innerHTML = '<div class="vacio-s">No hay reuniones agendadas para este día.</div>'; return; }
  $('#diaLista').innerHTML = lista.map(r => {
    const pasada = new Date(r.fin) < ahora;
    const estado = pasada ? ['Finalizada', 'b-green'] : S.cal.sel === hoyClave() ? ['Hoy', 'b-blue'] : r.organizo ? ['Organizas', 'b-blue'] : r.soyInvitado ? ['Invitado', 'b-gray'] : ['Equipo', 'b-gray'];
    const lugar = [r.lugar || (r.meet ? 'Google Meet' : ''), plural(r.participantes, 'participante', 'participantes')].filter(Boolean).join(' · ');
    const acts = [
      r.meet && !pasada && (r.soyInvitado || r.organizo) && `<a class="btn btn-sm btn-primary" href="${esc(r.meet)}" target="_blank" rel="noopener">Unirse</a>`,
      !pasada && (r.organizo || can('admin')) && `<button class="btn btn-sm btn-danger" data-act="cancelarReunion" data-id="${esc(r.id)}">Cancelar</button>`
    ].filter(Boolean).join('');
    return `<article class="reunion">
      <div class="reunion-cab"><b>${esc(r.titulo)}</b><span class="badge ${estado[1]}">${estado[0]}</span></div>
      <div class="reunion-meta"><span>${ic('clock', 16)}${rango(r)}</span>${lugar ? `<span>${ic('pin', 16)}${esc(lugar)}</span>` : ''}</div>
      ${acts ? `<div class="reunion-acts">${acts}</div>` : ''}</article>`;
  }).join('');
}

/* ---------- Recordatorios de reuniones ---------- */
async function programarRecordatorios() {
  (S.recTimers || []).forEach(clearTimeout); S.recTimers = [];
  if (!S.user) return;
  try {
    const r = await call('recordatorios');
    if (!r.minutos) return;
    const ahora = Date.now();
    r.eventos.forEach(ev => {
      const espera = new Date(ev.inicio).getTime() - r.minutos * 60000 - ahora;
      if (espera > -r.minutos * 60000 && espera < 86400000) {
        S.recTimers.push(setTimeout(() => {
          if (S.avisados.has(ev.id) || !S.user) return;
          S.avisados.add(ev.id);
          const faltan = Math.max(0, Math.round((new Date(ev.inicio) - Date.now()) / 60000));
          toast('«' + ev.titulo + '» empieza ' + (faltan ? 'en ' + faltan + ' min' : 'ahora') + '.');
        }, Math.max(espera, 0)));
      }
    });
  } catch (e) { /* los recordatorios no deben interrumpir el uso */ }
}

      titulo: 'Editar usuario', sub: 'Los cambios de rol o estado cierran las sesiones abiertas de ese usuario.', valores: u,
      campos: [
        { k: 'email', label: 'Correo', ro: true, full: true },
        { k: 'nombre', label: 'Nombre completo', req: true },
        { k: 'area', label: 'Área' },
        { k: 'rol', label: 'Rol', type: 'select', opts: [['lector', 'Lector'], ['editor', 'Editor'], ['admin', 'Administrador']], req: true },
        { k: 'activo', label: 'Estado', type: 'select', opts: [['SI', 'Activo'], ['NO', 'Desactivado']] }
      ],
      onSubmit: async d => { await call('guardarUsuario', { ...d, id }); toast('Usuario actualizado'); refrescar(); }
    });
  }
};

/* ---------- Eventos globales ---------- */
document.addEventListener('click', e => {
  const modal = $('#modal');
  if (e.target === modal || e.target.closest('[data-close]')) { cerrarModal(); return; }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go, g.dataset.id ? { id: g.dataset.id } : {}); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) {
    e.preventDefault();
    Promise.resolve().then(() => ACT[a.dataset.act](a.dataset.id)).catch(x => toast(x.message, true));
  }
});

document.addEventListener('submit', e => {
  if (!e.target.matches('[data-search]')) return;
  e.preventDefault();
  const q = e.target.q.value.trim();
  if (q.length >= 2) go('buscar', { q });
  else toast('Escribe al menos 2 caracteres para buscar.', true);
});

document.addEventListener('change', async e => {
  const cb = e.target.closest('[data-completar]');
  if (!cb) return;
  cb.disabled = true;
  try { await call('moverTarea', { id: cb.dataset.completar, estado: 'Completada' }); toast('Tarea completada'); refrescar(); }
  catch (x) { cb.checked = false; cb.disabled = false; toast(x.message, true); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { cerrarModal(); cerrarMenu(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-go]')) e.target.click();
});

document.addEventListener('DOMContentLoaded', () => {
  iniciar().catch(e => {
    console.error('Error al iniciar la intranet:', e);
    try { mostrarLogin('No se pudo iniciar la aplicación: ' + (e && e.message || e)); } catch (_) {}
  });
});

async function iniciar() {
  $('#brand').innerHTML = marcaHTML();
  $('#loginBrand').innerHTML = marcaHTML();
  $('#sbToggle').innerHTML = ic('panel');
  $('#btnLogout').innerHTML = ic('logout');
  $('#menuBtn').innerHTML = ic('menu');
  $('#icInfo').innerHTML = ic('info', 16);
  $('#anio').textContent = new Date().getFullYear();

  document.querySelectorAll('[data-ver]').forEach(b => {
    b.innerHTML = ic('eye', 18);
    b.addEventListener('click', () => {
      const p = b.parentElement.querySelector('input');
      const ver = p.type === 'password';
      p.type = ver ? 'text' : 'password';
      b.setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  });
  $('#loginForm').addEventListener('submit', onLogin);
  $('#registroForm').addEventListener('submit', onRegistro);
  const btnSso = $('#btnSsoDirecto');
  if (btnSso) btnSso.addEventListener('click', onSsoDirecto);
  if (CFG.registro) {
    $('#accesoTabs').classList.remove('hidden');
    document.querySelector('[data-solo-registro]').classList.remove('hidden');
  }
  $('#tabLogin').addEventListener('click', () => mostrarTab('login'));
  $('#tabRegistro').addEventListener('click', () => mostrarTab('registro'));
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => mostrarTab(b.dataset.tab)));
  $('#btnLogout').addEventListener('click', () => salir('Cerraste sesión correctamente.'));
  $('#sbToggle').addEventListener('click', () => {
    const c = $('#app').classList.toggle('collapsed');
    store.set('pq_sb', c ? '1' : null);
  });
  $('#menuBtn').addEventListener('click', () => $('#app').classList.add('menu-open'));
  $('#scrim').addEventListener('click', cerrarMenu);
  if (store.get('pq_sb')) $('#app').classList.add('collapsed');

  if (CFG.ssoToken && CFG.ssoUser) {
    entrar(CFG.ssoToken, CFG.ssoUser);
    return;
  }

  const t = store.get('pq_t');
  if (t) {
    try { const o = await run('validarSesion', t); entrar(t, o.usuario); return; }
    catch (e) { store.set('pq_t', null); }
  }
  mostrarLogin(CFG.ssoError || '');
}
</script>
